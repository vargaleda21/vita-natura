<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vita-Natura – Intelligens Receptkereső</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container header-container">
      <a href="#" class="brand">Vita-Natura</a>
      <span class="header-tagline">Döntéstámogató Konyha</span>
    </div>
  </header>

  <!-- MAIN SEARCH SECTION -->
  <main class="container">
    <section class="hero-pantry-section">
      <div class="hero-content">
        <h1 class="hero-title">Kevesebb keresgélés.<br>Több jó döntés.</h1>
        <p class="hero-subtitle">Te mondd meg, mid van otthon. Mi megmutatjuk, mit főzhetsz belőle.</p>
      </div>

      <!-- PANTRY BUILDER -->
      <div class="pantry-builder">
        <div class="pantry-header-row">
          <label for="ingredient-input" class="pantry-label">1. Írd be az otthoni alapanyagokat:</label>
        </div>
        
        <div class="pantry-custom-input" style="display: flex; gap: 10px; margin-bottom: 15px;">
          <input type="text" id="ingredient-input" placeholder="pl. csirkemell, rizs, cukkini..." autocomplete="off" style="flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px;">
          <button id="search-btn" class="btn btn-primary">Keresés</button>
        </div>

        <div id="unrecognized-warning" class="custom-warning" style="display: none; background: #fff3cd; color: #856404; padding: 10px; border-radius: 6px; margin-bottom: 15px;"></div>

        <div class="selected-summary">
          <span class="summary-label">Kiválasztott alapanyagok:</span>
          <div id="ingredient-tags" class="chip-group-selected" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;"></div>
        </div>

        <div class="divider" style="margin: 20px 0; border-bottom: 1px solid #eee;"></div>

        <label class="pantry-label">2. Opcionális szűrők:</label>
        <div class="filters-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px;">
          <div class="filter-group">
            <label for="filter-time">Mennyi időd van?</label>
            <select id="filter-time" style="width: 100%; padding: 10px; border-radius: 6px;">
              <option value="any">Mindegy</option>
              <option value="15">Max 15 perc</option>
              <option value="25">Max 25 perc</option>
              <option value="35">Max 35 perc</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="filter-meal">Melyik étkezés?</label>
            <select id="filter-meal" style="width: 100%; padding: 10px; border-radius: 6px;">
              <option value="any">Mindegy</option>
              <option value="reggeli">Reggeli</option>
              <option value="ebed">Ebéd</option>
              <option value="vacsora">Vacsora</option>
              <option value="snack">Snack</option>
            </select>
          </div>
        </div>
      </div>

      <!-- RESULTS SECTION -->
      <div id="recipe-results-container" class="results-container" style="margin-top: 30px;"></div>
    </section>
  </main>

  <!-- MODAL: RECEPT RÉSZLETEK -->
  <div id="recipe-modal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
    <div class="modal-content" style="background: #fff; padding: 25px; border-radius: 8px; max-width: 600px; width: 90%; max-height: 85vh; overflow-y: auto; position: relative; margin: 5% auto;">
      <span class="modal-close" onclick="UIController.closeModal()" style="position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer;">&times;</span>
      <div id="modal-content-container"></div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer" style="margin-top: 50px; padding: 20px 0; text-align: center; border-top: 1px solid #eee;">
    <div class="container text-center">
      <p>Vita-Natura MVP &copy; 2026 – Csendes döntéstámogatás a mindennapokban.</p>
    </div>
  </footer>

  <!-- SCRIPT LOAD ORDER (SZIGORÚ FÜGGŐSÉGI LÁNC) -->
  <!-- 1. Adatmodellek -->
  <script src="js/data/demoProductsData.js"></script>
  <script src="js/data/recipesData.js"></script>

  <!-- 2. Recipe Engine -->
  <script src="js/engines/recipeEngine.js"></script>

  <!-- 3. UI Controller -->
  <script src="js/ui/uiController.js"></script>

  <!-- 4. Analytics -->
  <script src="js/analytics.js"></script>

  <!-- 5. App belépési pont (Legutoljára!) -->
  <script src="js/app.js"></script>
</body>
</html>

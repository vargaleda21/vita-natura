<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vita-Natura – Kevesebb keresgélés. Több jó döntés.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container header-container">
      <a href="#" class="brand">Vita-Natura</a>
      <span class="header-tagline">Döntéstámogató Konyha</span>
    </div>
  </header>

  <!-- HERO + IMMEDIATE PANTRY BUILDER (B-VERSION ABOVE THE FOLD) -->
  <main class="container">
    <section class="hero-pantry-section">
      <div class="hero-content">
        <h1 class="hero-title">Kevesebb keresgélés.<br>Több jó döntés.</h1>
        <p class="hero-subtitle">Te mondd meg, mid van otthon. Mi megmutatjuk, mit főzhetsz belőle.</p>
      </div>

      <!-- PANTRY BUILDER -->
      <div class="pantry-builder">
        <div class="pantry-header-row">
          <label class="pantry-label">1. Válassz az otthoni alapanyagokból:</label>
          <button id="reset-pantry-btn" class="btn-text">Új keresés / Alaphelyzet</button>
        </div>
        
        <div id="ingredient-chips" class="chip-group"></div>
        
        <div class="pantry-custom-input">
          <input type="text" id="custom-ingredient-input" placeholder="+ Egyéb alapanyag hozzáadása (pl. brokkoli, citrom)">
          <button id="add-custom-ingredient-btn" class="btn-small">Hozzáadás</button>
        </div>

        <div class="selected-summary">
          <span class="summary-label">Kiválasztott alapanyagok:</span>
          <div id="selected-ingredients-list" class="chip-group-selected"></div>
          <p id="custom-warning-text" class="custom-warning hidden"></p>
        </div>

        <div class="divider"></div>

        <label class="pantry-label">2. Opcionális szűrők:</label>
        <div class="filters-grid">
          <div class="filter-group">
            <label for="time-filter">Mennyi időd van?</label>
            <select id="time-filter">
              <option value="any">Mindegy</option>
              <option value="15">Max 15 perc</option>
              <option value="30">Max 30 perc</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="meal-filter">Melyik étkezés?</label>
            <select id="meal-filter">
              <option value="any">Mindegy</option>
              <option value="reggeli">Reggeli</option>
              <option value="ebed">Ebéd</option>
              <option value="vacsora">Vacsora</option>
            </select>
          </div>
        </div>

        <button id="search-recipes-btn" class="btn btn-primary btn-full">MIT TUDOK EBBŐL FŐZNI?</button>
      </div>

      <!-- RESULTS SECTION -->
      <div id="recipe-results-container" class="results-container hidden">
        <h2 id="results-title" class="results-title">Releváns találatok</h2>
        <p id="results-subtitle" class="results-subtitle hidden"></p>
        <div id="recipe-cards-grid" class="cards-grid"></div>
      </div>
    </section>
  </main>

  <!-- MODAL: RECEPT RÉSZLETEK -->
  <div id="recipe-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <button class="modal-close" aria-label="Bezárás">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container text-center">
      <p>Vita-Natura 2.0 MVP &copy; 2026 – Csendes döntéstámogatás a mindennapokban.</p>
    </div>
  </footer>

  <script src="js/analytics.js"></script>
  <script src="js/data/recipesData.js"></script>
  <script src="js/data/demoProductsData.js"></script>
  <script src="js/engines/recipeEngine.js"></script>
  <script src="js/ui/uiController.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

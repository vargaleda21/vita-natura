<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vita-Natura – Intelligens Receptkereső</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="main-header">
    <div class="container">
      <h1>Vita-Natura</h1>
      <p class="tagline">Főzz abból, amid van!</p>
    </div>
  </header>

  <main class="container">
    <!-- Alapanyag kereső szekció -->
    <section class="search-section">
      <div class="search-box">
        <label for="ingredient-input">Milyen alapanyagaid vannak otthon?</label>
        <div class="input-group">
          <input type="text" id="ingredient-input" placeholder="pl. csirkemell, rizs, cukkini..." autocomplete="off">
          <button id="search-btn" class="btn-primary">Keresés</button>
        </div>
        <div id="unrecognized-warning" class="warning-box" style="display: none;"></div>
        <div id="ingredient-tags" class="tags-container"></div>
      </div>

      <!-- Szűrők -->
      <div class="filters-bar">
        <div class="filter-group">
          <label for="filter-time">Max. elkészítési idő:</label>
          <select id="filter-time">
            <option value="any">Bármennyi</option>
            <option value="15">15 perc</option>
            <option value="25">25 perc</option>
            <option value="35">35 perc</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filter-meal">Étkezés típusa:</label>
          <select id="filter-meal">
            <option value="any">Mindegyik</option>
            <option value="reggeli">Reggeli</option>
            <option value="ebed">Ebéd</option>
            <option value="vacsora">Vacsora</option>
            <option value="snack">Snack</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Találati lista szekció -->
    <section class="results-section">
      <div id="recipe-results-container" class="results-grid"></div>
    </section>
  </main>

  <!-- Recept Részletek Modal -->
  <div id="recipe-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close-btn" onclick="UIController.closeModal()">&times;</span>
      <div id="modal-content-container"></div>
    </div>
  </div>

  <footer class="main-footer">
    <div class="container">
      <p>&copy; 2026 Vita-Natura MVP. Minden jog fenntartva.</p>
    </div>
  </footer>

  <!-- SCRIPT LOAD ORDER (STRICT DEPENDENCY CHAIN) -->
  <script src="js/data/demoProductsData.js"></script>
  <script src="js/data/recipesData.js"></script>
  <script src="js/engines/recipeEngine.js"></script>
  <script src="js/ui/uiController.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

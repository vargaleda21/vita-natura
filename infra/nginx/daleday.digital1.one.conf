# daleday.digital1.one — the DaleDay demo (static Expo web export, SPA), a temporary spot.
# Cloudflare proxied (Full strict), certbot LE via the shared ACME webroot:
#   certbot certonly --webroot -w /var/www/certbot -d daleday.digital1.one
# nginx 1.24: plain `listen 443 ssl` (no `http2 on;`). Source: the tuda repo, infra/nginx/.
# Read-only proxies for product data the browser cannot fetch itself (no CORS). They send no
# client headers upstream (no cookies, no IP), only GET, only the listed paths. tools/serve.mjs mirrors them.

server {
    listen 80;
    listen [::]:80;
    server_name daleday.digital1.one;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://daleday.digital1.one$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name daleday.digital1.one;

    ssl_certificate     /etc/letsencrypt/live/daleday.digital1.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daleday.digital1.one/privkey.pem;

    root /var/www/daleday.digital1.one;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;
    gzip_min_length 1024;

    # GVH Árfigyelő: current shelf prices per chain, by EAN. /api/arfigyelo/product/<ean>, /search?q=, /shops, /chain-stores.
    location ^~ /api/arfigyelo/ {
        include snippets/daleday.digital1.one-security-headers.conf;
        limit_except GET { deny all; }
        rewrite "^/api/arfigyelo/(product/[0-9A-Za-z-]{1,40})$" /api/$1 break;
        rewrite ^/api/arfigyelo/(search|shops|chain-stores)$ /api/$1 break;
        return 404;
        proxy_pass https://arfigyelo.gvh.hu;
        proxy_ssl_server_name on;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host arfigyelo.gvh.hu;
        proxy_set_header Accept "application/json";
        proxy_set_header User-Agent "DaleDay demo (+https://daleday.digital1.one)";
        proxy_hide_header Set-Cookie;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Strict-Transport-Security;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # UPCitemdb's free trial lookup (general goods), as the last source. /api/upc/lookup?upc=<code>
    location = /api/upc/lookup {
        include snippets/daleday.digital1.one-security-headers.conf;
        limit_except GET { deny all; }
        proxy_pass https://api.upcitemdb.com/prod/trial/lookup;
        proxy_ssl_server_name on;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host api.upcitemdb.com;
        proxy_set_header Accept "application/json";
        proxy_set_header User-Agent "DaleDay demo (+https://daleday.digital1.one)";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Open Food Facts search, for alternatives. Browsers often get a 503 without CORS from it; the server does not.
    location = /api/off/search {
        include snippets/daleday.digital1.one-security-headers.conf;
        limit_except GET { deny all; }
        proxy_pass https://world.openfoodfacts.org/api/v2/search;
        proxy_ssl_server_name on;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host world.openfoodfacts.org;
        proxy_set_header Accept "application/json";
        proxy_set_header User-Agent "DaleDay demo (+https://daleday.digital1.one)";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_connect_timeout 5s;
        proxy_read_timeout 12s;
    }

    # Open Food Facts search index (search.openfoodfacts.org), asked before the classic search above.
    location = /api/off/sal {
        include snippets/daleday.digital1.one-security-headers.conf;
        limit_except GET { deny all; }
        proxy_pass https://search.openfoodfacts.org/search;
        proxy_ssl_server_name on;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host search.openfoodfacts.org;
        proxy_set_header Accept "application/json";
        proxy_set_header User-Agent "DaleDay demo (+https://daleday.digital1.one)";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # One-off file shares (a source zip for a handover): /dl/<random token>/<file>. No listing, never cached;
    # files live in /var/www/daleday-share/dl/ and a cron job deletes them after 30 days.
    location ^~ /dl/ {
        include snippets/daleday.digital1.one-security-headers.conf;
        root /var/www/daleday-share;
        autoindex off;
        add_header Cache-Control "no-store" always;
        add_header Content-Disposition "attachment" always;
        try_files $uri =404;
    }

    # Hashed bundles and assets never change under the same name.
    location ^~ /_expo/static/ {
        include snippets/daleday.digital1.one-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ^~ /assets/ {
        include snippets/daleday.digital1.one-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # A types block here would replace every MIME type of the server, so it stays in this location.
    location = /manifest.webmanifest {
        include snippets/daleday.digital1.one-security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        types { }
        default_type application/manifest+json;
    }

    # Icons have versioned names; the fixed iOS root icons and the manifest are re-checked.
    location ~* \.(png|ico|svg)$ {
        include snippets/daleday.digital1.one-security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # The app shell: always fresh, and every route falls back to it (SPA).
    location / {
        include snippets/daleday.digital1.one-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}

<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingyenes nyomtatható levél a Jézuskának – Égi Posta</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta name="theme-color" content="#14233b">
<meta name="description" content="Ingyenes, nyomtatható levélsablon a Jézuskának és a Mikulásnak. Töltsd le, nyomtasd ki, és a gyerek megírhatja vagy lerajzolhatja a kívánságait.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600&family=Great+Vibes&family=Dancing+Script:wght@600&family=Inter:wght@400;600&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  @page{size:A4;margin:0}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#e9e1cf;font-family:"Cormorant Garamond",Georgia,serif;color:#2b2340}
  .bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:12px;background:#14233b;color:#fff;font-family:Inter,sans-serif;font-size:14px}
  .bar a{color:#fff;opacity:.75;text-decoration:none;padding:6px 10px;border-radius:8px}
  .bar a.on{opacity:1;background:rgba(255,255,255,.14)}
  .bar button{font:inherit;font-weight:600;background:#8f1d24;color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer}
  .wrap{padding:24px 12px 40px;display:flex;justify-content:center}
  .page{position:relative;width:210mm;height:297mm;overflow:hidden;background:#fdf8ec;box-shadow:0 20px 50px rgba(20,35,59,.25);
    background-image:radial-gradient(ellipse 120% 90% at 50% 45%,transparent 60%,rgba(150,110,50,.13) 100%)}
  .frame{position:absolute;inset:9mm;border:1.4px solid #c39b4a}
  .frame::after{content:"";position:absolute;inset:2mm;border:.6px solid #d8bd7e}
  .corner{position:absolute;width:26mm;height:26mm}
  .corner.tl{top:5mm;left:5mm}.corner.tr{top:5mm;right:5mm;transform:scaleX(-1)}
  .corner.bl{bottom:5mm;left:5mm;transform:scaleY(-1)}.corner.br{bottom:5mm;right:5mm;transform:scale(-1,-1)}
  .content{position:absolute;inset:16mm 20mm 26mm;display:flex;flex-direction:column}
  .sprig{display:block;width:62mm;margin:0 auto 1mm}
  h1{font-family:"Great Vibes",cursive;font-weight:400;font-size:64px;color:#8f1d24;text-align:center;margin:0 0 4mm;line-height:1.1}
  .row{display:flex;gap:8mm;align-items:flex-end;margin:3mm 0}
  .lbl{font-size:19px;font-weight:600;white-space:nowrap}
  .line{flex:1;border-bottom:1.6px dashed #b9a681;height:9mm}
  .sec{font-size:19px;font-weight:600;margin:5mm 0 1mm}
  .sec small{font-weight:500;font-style:italic;color:#7a6a55;font-size:15px}
  .lines .line{display:block;height:10mm;margin-bottom:0}
  .box{flex:1;min-height:60mm;border:2px dashed #c9ad6d;border-radius:8mm;margin:2mm 0 2mm;position:relative;background:rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center}
  .box span{font-style:italic;color:#c2b28f;font-size:20px}
  .box svg{position:absolute;width:12mm;opacity:.55}
  .stars{display:flex;gap:6mm;margin-top:2mm}
  .stars svg{width:14mm;height:14mm}
  .sign{display:flex;align-items:flex-end;gap:6mm;margin-top:6mm}
  .sign .lbl{font-family:"Dancing Script",cursive;font-size:24px;font-weight:600;color:#8f1d24}
  .foot{position:absolute;left:20mm;right:20mm;bottom:12.5mm;display:flex;align-items:center;justify-content:center;gap:3mm;font-family:Inter,sans-serif;font-size:10.5px;color:#7a6a55;letter-spacing:.02em}
  .foot b{color:#8f1d24}
  .foot svg{width:5mm;height:5mm}
  .ruled .line{height:9.5mm}
  @media print{body{background:#fff}.bar{display:none}.wrap{padding:0}.page{box-shadow:none}}
  body.pdf .bar{display:none} body.pdf .wrap{padding:0} body.pdf .page{box-shadow:none} body.pdf{background:#fff}
  @media screen and (max-width:820px){.page{transform-origin:top center}}
</style>
<script src="/js/consent.js"></script>
<!-- Barion Pixel (Base, csalásmegelőzés) -->
<script>
(function(){
  if(/[?&](print|pdf)=/.test(location.search)) return;
  window["bp"]=window["bp"]||function(){(window["bp"].q=window["bp"].q||[]).push(arguments);};
  window["bp"].l=1*new Date();
  var s=document.createElement("script"),f=document.getElementsByTagName("script")[0];
  s.async=true; s.src="https://pixel.barion.com/bp.js";
  (f&&f.parentNode?f.parentNode.insertBefore(s,f):document.head.appendChild(s));
  window["barion_pixel_id"]="BP-edQ2lVa0vP-65";
  bp("init","addBarionPixelId",window["barion_pixel_id"]);
})();
</script>
<noscript><img height="1" width="1" style="display:none" alt="Barion Pixel" src="https://pixel.barion.com/a.gif?ba_pixel_id=BP-edQ2lVa0vP-65&ev=contentView&noscript=1"></noscript>
</head>
<body>
<div class="bar" id="bar">
  <a href="?v=jezuska" data-v="jezuska">Jézuskának – rajzolós</a>
  <a href="?v=iros" data-v="iros">Jézuskának – nagyobbaknak</a>
  <a href="?v=mikulas" data-v="mikulas">Mikulásnak</a>
  <button type="button" id="print">Nyomtatás / mentés PDF-be</button>
</div>
<div class="wrap"><div class="page" id="page"></div></div>

<script>
(function(){
  const qs=new URLSearchParams(location.search);
  const v=['jezuska','iros','mikulas'].includes(qs.get('v'))?qs.get('v'):'jezuska';
  if(qs.get('pdf')) document.body.classList.add('pdf');
  document.querySelectorAll('.bar a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  document.getElementById('print').onclick=()=>window.print();
  const host = location.host && !/^(localhost|127\.)/.test(location.host) ? location.host.replace(/^www\./,'') : 'egiposta.hu';

  const corner=`<svg class="corner {c}" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="#c39b4a" stroke-linecap="round"><path d="M8 70 C8 35 30 10 66 8" stroke-width="2"/><path d="M66 8 C80 7 88 14 87 23 C86 31 77 33 72 29 C68 26 70 19 76 20" stroke-width="1.7"/><path d="M8 70 C7 82 14 90 23 89 C31 88 33 79 29 74 C26 70 19 72 20 78" stroke-width="1.7"/></g><g fill="#3f7a5d"><path d="M26 30 c8-6 14-4 16 1 c-6 3-11 3-16-1z"/><path d="M34 22 c5-7 11-7 13-3 c-4 4-9 5-13 3z"/><path d="M20 42 c5-6 11-6 13-2 c-5 4-10 5-13 2z"/></g><circle cx="27" cy="26" r="3.6" fill="#b8323d"/><circle cx="33" cy="30" r="3" fill="#b8323d"/><circle cx="21" cy="21" r="3.4" fill="#c39b4a"/><circle cx="15" cy="27" r="2" fill="#c39b4a"/></svg>`;
  const corners=['tl','tr','bl','br'].map(c=>corner.replace('{c}',c)).join('');
  const sprig=`<svg class="sprig" viewBox="0 0 240 60" aria-hidden="true"><g stroke-linecap="round" stroke-width="2.4">`+
    Array.from({length:22},(_,i)=>{const t=i/21,x=100-t*86,y=34+Math.sin(t*2)*5;return `<line x1="${x}" y1="${y}" x2="${x-7}" y2="${y-9+t*3}" stroke="#3f7a5d"/><line x1="${x}" y1="${y}" x2="${x-7}" y2="${y+8-t*3}" stroke="#2f5d4a"/><line x1="${240-x}" y1="${y}" x2="${247-x}" y2="${y-9+t*3}" stroke="#3f7a5d"/><line x1="${240-x}" y1="${y}" x2="${247-x}" y2="${y+8-t*3}" stroke="#2f5d4a"/>`}).join('')+
    `</g><circle cx="104" cy="40" r="4.5" fill="#b8323d"/><circle cx="112" cy="44" r="3.8" fill="#b8323d"/><circle cx="136" cy="40" r="4.5" fill="#b8323d"/><circle cx="128" cy="44" r="3.8" fill="#b8323d"/><path d="M116 9 h8 v6 h-8z" fill="#a37a22"/><circle cx="120" cy="28" r="13" fill="#d6ac4c" stroke="#a37a22" stroke-width="1"/><path d="M109 26 h22" stroke="#a37a22" stroke-width="1.2" opacity=".7"/><circle cx="115.5" cy="23" r="3.2" fill="#fff" opacity=".6"/></svg>`;
  const star=`<svg viewBox="0 0 24 26" aria-hidden="true"><path d="M10 1.6h4v3h-4z" fill="none" stroke="#c39b4a" stroke-width="1.2"/><circle cx="12" cy="15" r="9.6" fill="none" stroke="#c39b4a" stroke-width="1.3"/><path d="M3.4 13.6c5 2 12.2 2 17.2 0" fill="none" stroke="#c39b4a" stroke-width="1"/></svg>`;
  const tiny=(x,y)=>`<svg viewBox="-12 -12 24 24" style="${x};${y}" aria-hidden="true"><g stroke="#e3cf9b" stroke-width="1.6" stroke-linecap="round" fill="none">${[0,60,120].map(r=>`<path transform="rotate(${r})" d="M0 -10V10M0 -6l-3 -3M0 -6l3 -3M0 6l-3 3M0 6l3 3"/>`).join('')}</g></svg>`;
  const emblem=`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="none" stroke="#8f1d24" stroke-width="1.4"/><path d="M12 5.5c.8 1.9 2 3.1 3.4 3.8-.8.3-1.6.3-2.3.1 1.2 1.7 2.8 2.8 4.5 3.5-1.2.4-2.6.4-3.7.1 1.3 1.6 3 2.7 4.8 3.4-4 1.1-9.4 1.1-13.4 0 1.8-.7 3.5-1.8 4.8-3.4-1.1.3-2.5.3-3.7-.1 1.7-.7 3.3-1.8 4.5-3.5-.7.2-1.5.2-2.3-.1 1.4-.7 2.6-1.9 3.4-3.8z" fill="#8f1d24"/></svg>`;
  const lines=n=>`<div class="lines">${'<span class="line"></span>'.repeat(n)}</div>`;
  const foot=`<div class="foot">${emblem}<span>${v==='mikulas'?'A Mikulás':'A Jézuska'} válaszolhat is! Személyre szabott válaszlevél: <b>${host}</b></span></div>`;

  let body='';
  if(v==='iros'){
    body=`${sprig}<h1>Kedves Jézuska!</h1>
      <div class="row"><span class="lbl">A nevem:</span><span class="line"></span><span class="lbl">Életkorom:</span><span class="line" style="flex:.35"></span></div>
      <div class="ruled">
        <div class="sec">Idén erre vagyok a legbüszkébb:</div>${lines(3)}
        <div class="sec">Ezt szeretném karácsonyra: <small>(akár többet is)</small></div>${lines(4)}
        <div class="sec">Amit jövőre szeretnék megtanulni:</div>${lines(3)}
      </div>
      <div class="sign"><span class="lbl">Szeretettel:</span><span class="line"></span></div>`;
  } else {
    const isM = v==='mikulas';
    body=`${sprig}<h1>${isM?'Kedves Mikulás!':'Kedves Jézuska!'}</h1>
      <div class="row"><span class="lbl">A nevem:</span><span class="line"></span><span class="lbl">Ennyi éves vagyok:</span><span class="line" style="flex:.3"></span></div>
      <div class="sec">Idén ebben voltam nagyon ügyes:</div>${lines(2)}
      <div class="sec">${isM?'Ezt szeretném a csizmámba:':'Ezt szeretném kérni karácsonyra:'}</div>
      <div class="box">${tiny('left:5mm','top:5mm')}${tiny('right:6mm','top:8mm')}${tiny('left:8mm','bottom:6mm')}${tiny('right:5mm','bottom:5mm')}<span>Ide írhatod vagy lerajzolhatod!</span></div>
      <div class="sec">Ennyire voltam jó idén: <small>(színezd ki a gömböket)</small></div>
      <div class="stars">${star.repeat(5)}</div>
      <div class="sign"><span class="lbl">Szeretettel:</span><span class="line"></span></div>`;
  }
  document.getElementById('page').innerHTML = `<div class="frame"></div>${corners}<div class="content">${body}</div>${foot}`;
  document.title = (v==='mikulas'?'Ingyenes nyomtatható levél a Mikulásnak':'Ingyenes nyomtatható levél a Jézuskának')+' – Égi Posta';

  // mobilon a lapot a képernyőhöz igazítjuk
  function fit(){ const p=document.getElementById('page'); if(document.body.classList.contains('pdf')) return;
    const k=Math.min(1,(window.innerWidth-24)/p.offsetWidth); p.style.transform=k<1?`scale(${k})`:''; p.style.marginBottom=k<1?`${-(1-k)*p.offsetHeight}px`:''; }
  window.addEventListener('resize',fit); fit();
  (document.fonts&&document.fonts.ready||Promise.resolve()).then(()=>setTimeout(()=>{window.__READY=true;},200));
})();
</script>
</body>
</html>
